plugins {
    id 'java-library'
    id 'maven-publish'
}
group = rootProject.group
version = rootProject.version
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.jar {
    archiveBaseName = 'edgebase-android-java'
}
repositories { mavenCentral(); google() }
def projectPath = { String monorepoPath, String standalonePath ->
    findProject(monorepoPath) != null ? monorepoPath : standalonePath
}
dependencies {
    api project(projectPath(':packages:core', ':core'))
    api project(projectPath(':packages:admin', ':admin'))
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    // Modern Android API stubs for host-side SDK compilation. The obsolete
    // Android 4.1 Maven stub omits WebView failure/process callbacks and can
    // silently let release code drift from the supported Android runtime.
    compileOnly 'org.robolectric:android-all:14-robolectric-10818077'
    compileOnly 'org.json:json:20260814'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Android stubs needed at test runtime — TurnstileProvider imports android.* at class level
    // (compileOnly is not available during `gradle test` JVM execution → NoClassDefFoundError)
    testImplementation 'org.robolectric:android-all:14-robolectric-10818077'
    testImplementation 'org.json:json:20260814'
}

tasks.test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = 'edgebase-android-java'
            pom {
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
}
