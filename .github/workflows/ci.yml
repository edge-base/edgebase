name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-version-check:
    name: Release Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lockstep release versions
        run: node ./scripts/check-release-versions.mjs

      - name: Test release and supply-chain contracts
        run: pnpm release:test

  ci-node:
    name: Core CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies
        run: pnpm security:audit

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Docs Verification
        run: pnpm --filter docs verify

      - name: Shared Unit Tests
        run: pnpm --dir packages/shared test

      - name: CLI Unit Tests
        run: pnpm --dir packages/cli test

      - name: Server Unit Tests
        run: pnpm --dir packages/server test

      - name: Admin Dashboard Tests
        run: pnpm --dir packages/admin test

  compatibility-node:
    name: Node Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-OS compatibility is intentionally scoped to user-facing Node packages.
      # Bash-heavy maintainer scripts and E2E orchestration move through dedicated test jobs.
      - name: Build shared package
        run: pnpm --dir packages/shared build

      - name: Build CLI package
        run: pnpm --dir packages/cli build

      - name: Build JS SDK core package
        run: pnpm --dir packages/sdk/js/packages/core build

      - name: Build server package
        run: pnpm --dir packages/server build

      - name: Build admin dashboard
        run: pnpm --dir packages/admin build

      - name: Build JS SDK web package
        run: pnpm --dir packages/sdk/js/packages/web build

      - name: Build JS SDK admin package
        run: pnpm --dir packages/sdk/js/packages/admin build

      - name: Build JS SDK SSR package
        run: pnpm --dir packages/sdk/js/packages/ssr build

      - name: Build React Native SDK package
        run: pnpm --dir packages/sdk/react-native build

      - name: Test shared package
        run: pnpm --dir packages/shared test

      - name: Test CLI package
        run: pnpm --dir packages/cli run test:compat

      - name: Test server package
        run: pnpm --dir packages/server test

      - name: Test admin dashboard
        run: pnpm --dir packages/admin test

      - name: Test JS SDK core package
        run: pnpm --dir packages/sdk/js/packages/core test

      - name: Test JS SDK web package
        run: pnpm --dir packages/sdk/js/packages/web test

      - name: Test JS SDK admin package
        run: pnpm --dir packages/sdk/js/packages/admin test

      - name: Test React Native SDK package
        run: pnpm --dir packages/sdk/react-native test

  docker-smoke:
    name: Docker Smoke and Supply-Chain Scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Docker Smoke
        env:
          EDGEBASE_DOCKER_SMOKE_TAG: edgebase-docker-ci:${{ github.sha }}
          EDGEBASE_KEEP_DOCKER_SMOKE_IMAGE: '1'
        run: pnpm --dir packages/cli run test:docker-smoke

      - name: Generate verified-image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: edgebase-docker-ci:${{ github.sha }}
          format: cyclonedx
          output: edgebase-docker-sbom.cdx.json
          exit-code: '0'
          version: v0.70.0

      - name: Record every HIGH and CRITICAL finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: edgebase-docker-ci:${{ github.sha }}
          format: json
          output: edgebase-docker-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          skip-setup-trivy: 'true'
          timeout: 10m0s

      - name: Upload container security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgebase-container-security-${{ github.sha }}
          path: |
            edgebase-docker-sbom.cdx.json
            edgebase-docker-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: edgebase-docker-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          # Vendor findings without a fix remain in the JSON artifact above;
          # every finding with a remediation is release-blocking.
          ignore-unfixed: 'true'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          skip-setup-trivy: 'true'
          timeout: 10m0s

      - name: Remove scanned image
        if: always()
        run: docker image rm --force edgebase-docker-ci:${{ github.sha }} || true

  pack-smoke:
    name: Pack Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack Smoke
        run: pnpm --dir packages/cli run test:pack-smoke

  sdk-python:
    name: Python SDK Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e './packages/sdk/python/packages/core'
          pip install -e './packages/sdk/python/packages/admin'
          pip install -e './packages/sdk/python[dev]' --no-deps

      - name: Test Python SDK
        run: |
          pytest packages/sdk/python/tests/test_sdk.py
          pytest packages/sdk/python/packages/core/tests/test_core_unit.py
          pytest packages/sdk/python/packages/admin/tests/test_admin_unit.py

  sdk-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Test Swift SDK Core
        run: swift test
        working-directory: packages/sdk/swift/packages/core

      - name: Test Swift SDK iOS package
        shell: bash
        run: |
          SIM_JSON="$(xcrun simctl list devices available --json)"
          SIM_ID="$(printf '%s' "$SIM_JSON" | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; preferred=["iPhone 16","iPhone 16 Pro","iPhone 15","iPhone 15 Pro"]; available=[device for runtime in devices.values() for device in runtime if device.get("isAvailable")]; print(next((device["udid"] for name in preferred for device in available if device.get("name")==name), available[0]["udid"] if available else ""))')"
          test -n "$SIM_ID"
          xcodebuild test -scheme EdgeBase -destination "id=$SIM_ID"
        working-directory: packages/sdk/swift/packages/ios
